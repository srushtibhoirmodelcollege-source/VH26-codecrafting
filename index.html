<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cache Backend</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
        }
    </style>
</head>

<body>

    <h1>🚀 Cache Backend</h1>

    <h2>Add Data</h2>

    <input id="addKey" placeholder="Key">
    <input id="addValue" placeholder="Value">

    <button onclick="addData()">Add</button>


    <h2>Get Data</h2>

    <input id="getKey" placeholder="Key">

    <button onclick="getData()">Get</button>


    <h2>Evict Data</h2>

    <input id="evictKey" placeholder="Key">

    <button onclick="evictData()">Evict</button>


    <h2>Cache Status</h2>

    <button onclick="getStatus()">Check Cache</button>


    <div id="result">
        Result yahan dikhega...
    </div>


    <script>

        const API = "http://127.0.0.1:8000";


        // ADD
        async function addData() {

            const key = document.getElementById("addKey").value;
            const value = document.getElementById("addValue").value;

            const response = await fetch(
                `${API}/cache/add/${key}/${value}`,
                {
                    method: "POST"
                }
            );

            const data = await response.json();

            document.getElementById("result").innerText =
                JSON.stringify(data, null, 2);
        }


        // GET
        async function getData() {

            const key = document.getElementById("getKey").value;

            const response = await fetch(
                `${API}/cache/get/${key}`
            );

            const data = await response.json();

            document.getElementById("result").innerText =
                JSON.stringify(data, null, 2);
        }


        // EVICT
        async function evictData() {

            const key = document.getElementById("evictKey").value;

            const response = await fetch(
                `${API}/cache/evict/${key}`,
                {
                    method: "DELETE"
                }
            );

            const data = await response.json();

            document.getElementById("result").innerText =
                JSON.stringify(data, null, 2);
        }


        // STATUS
        async function getStatus() {

            const response = await fetch(
                `${API}/cache/status`
            );

            const data = await response.json();

            document.getElementById("result").innerText =
                JSON.stringify(data, null, 2);
        }

    </script>

</body>
</html>
